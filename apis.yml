description: >-
  Cometeer is a Gloucester, Massachusetts coffee company, founded in 2015 by
  Matthew Roberts and Douglas Hoon, that brews specialty coffee at high extraction
  and then flash-freezes it with liquid nitrogen into single-serve capsules shipped
  direct to consumers by subscription. Coffees are roasted by third-wave partners
  including Counter Culture, Intelligentsia, Onyx, Square Mile, Equator and George
  Howell. Cometeer publishes no developer API, but its Shopify-hosted storefront
  exposes a substantial machine-readable agent surface: an /llms.txt agent
  instruction set, OpenID Connect and RFC 8414 authorization-server metadata on its
  own apex host, and a live Universal Commerce Protocol (UCP) merchant profile
  advertising an MCP endpoint for agent-driven cart, checkout and order flows.
