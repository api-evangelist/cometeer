- aid: cometeer:ucp-commerce
  name: Cometeer UCP Commerce (MCP)
  description: >-
    Cometeer's Universal Commerce Protocol shopping service, exposed over MCP (JSON-RPC 2.0 via HTTP POST)
    at /api/ucp/mcp and advertised from /.well-known/ucp. Thirteen tools cover catalog search and lookup,
    cart, checkout, fulfillment, discount and order. Calls require a resolvable UCP agent profile URI,
    and completing payment requires contemporaneous human buyer approval.
