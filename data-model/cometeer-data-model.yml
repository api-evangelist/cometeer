note: >-
  Entity graph derived from the live storefront JSON payloads observed on
  2026-08-01 (250 products sampled from /products.json). Ids are opaque 64-bit
  integers with no id-prefix scheme.
entities:
- name: Product
  description: A sellable item in the Cometeer store.
  id_field: id
  id_type: integer(int64)
  key_field: handle
  observed_product_types: [Coffee Sleeve, Merchandise, TBD]
  observed_vendors: [Cometeer, East Fork, Fellow, Subminimal, notNeutral]
  fields: [id, title, handle, body_html, vendor, product_type, tags, published_at, created_at, updated_at, published_scope, template_suffix]
- name: Variant
  description: A purchasable configuration of a Product, carrying price and inventory.
  id_field: id
  id_type: integer(int64)
  fields: [id, product_id, title, sku, barcode, price, price_currency, compare_at_price, option1, option2, option3, grams, weight, weight_unit, taxable, requires_shipping, image_id, quantity_rule, quantity_price_breaks]
- name: Image
  description: A product image asset.
  id_field: id
  id_type: integer(int64)
  fields: [id, product_id, src, alt, width, height, position, variant_ids]
- name: Option
  description: A named product option axis (e.g. size) with its allowed values.
  id_field: id
  id_type: integer(int64)
  fields: [id, product_id, name, position, values]
- name: Collection
  description: >-
    A named grouping of products, addressed by handle. Not returned as a
    standalone JSON object by the public endpoints — only as the path segment of
    /collections/{handle}/products.json.
  id_field: handle
  id_type: string
relationships:
