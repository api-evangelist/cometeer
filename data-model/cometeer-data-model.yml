commerce_entities:
  note: >-
    Cart, Checkout and Order exist only on the UCP/MCP commerce surface and are
    defined by the UCP shopping schema, not by any Cometeer-published document.
    They are not modelled here because their field-level shape was not
    observable — tools/list is gated on a UCP agent profile.
  schemas:
  - https://ucp.dev/2026-04-08/schemas/shopping/cart.json
  - https://ucp.dev/2026-04-08/schemas/shopping/checkout.json
  see: mcp/cometeer-mcp.yml
