summary:
  types: [none, openIdConnect, oauth2]
  api_key_in: []
  oauth2_flows: [authorizationCode, refreshToken, jwt-bearer]
  note: >-
    Cometeer exposes three distinct surfaces with three distinct auth postures:
    an anonymous read-only storefront, an OpenID Connect customer identity
    provider (Shopify Customer Accounts), and a UCP/MCP commerce endpoint gated
    on an agent profile rather than a bearer token.
surfaces:
- id: storefront-read
  name: Read-only storefront JSON
  spec: openapi/cometeer-storefront-openapi.yml
  auth: none
  description: >-
    Product, collection, search and sitemap endpoints are public and require no
    credential. Cometeer documents them for agents under "Read-Only Browsing
    (No Authentication Required)" in /llms.txt.
- id: customer-account
  name: Customer Account identity (OpenID Connect)
  auth: openIdConnect
  description: >-
    Shopify Customer Accounts, provisioned for Cometeer shop 74101293355 and
    discoverable from Cometeer's own apex host. Intended for the shopper's own
    account/subscription portal at https://account.cometeer.com/account, not for
    third-party server-to-server integration.
- id: ucp-mcp
  name: UCP shopping MCP endpoint
  auth: ucp-agent-profile
  description: >-
    https://cometeer.com/api/ucp/mcp rejects anonymous JSON-RPC calls with HTTP
    422 / code -32001 `invalid_profile_url` until the calling agent presents a
    resolvable UCP agent profile URI. Payment completion additionally requires
    contemporaneous human buyer approval.
